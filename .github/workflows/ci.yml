name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Lecture seule par défaut ; seul le job de publication de la doc reçoit plus.
permissions:
  contents: read

jobs:
  # Rapide : toute la logique Python (extraction, streaming, requêtes DuckDB), sans Airflow.
  # Les tests des DAGs sont ignorés ici (pas d'Airflow) et tournent dans le job suivant.
  pytest:
    name: Tests Python
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest tests -v

  # Avec l'image Docker de production : mêmes versions d'Airflow, de dbt et de DuckDB
  # qu'en vrai, et le Dockerfile lui-même est vérifié au passage.
  image:
    name: Image Airflow, DAGs et dbt
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Construire l'image Airflow (Airflow + dbt)
        run: docker compose build airflow-scheduler

      - name: Tests des DAGs, dbt build sur un Bronze synthétique, puis dbt docs
        # SQLite jetable à la place de Postgres : les tests chargent les DAGs sans les exécuter.
        # site/ reçoit la doc dbt ; ouvert en écriture car le conteneur tourne sous un autre utilisateur.
        run: |
          mkdir -p site && chmod 777 site
          docker compose run --rm --no-deps \
            -e AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////tmp/airflow.db \
            -v "$PWD/scripts:/opt/airflow/scripts:ro" \
            -v "$PWD/site:/opt/airflow/site" \
            airflow-scheduler bash -c '
              set -euo pipefail
              airflow db migrate > /dev/null
              python -m pytest tests -v -p no:cacheprovider

              python /opt/airflow/scripts/make_bronze_fixture.py /tmp/fixture
              cd /opt/airflow/dbt
              export DATA_DIR=/tmp/fixture DBT_DUCKDB_PATH=/tmp/ci.duckdb
              dbt build --no-use-colors --exclude-resource-type unit_test
              dbt test  --no-use-colors --select "test_type:unit"

              # Site statique (un seul fichier HTML) : modèles, colonnes, tests, lineage, SQL.
              # Généré sur le Bronze synthétique : la structure est documentée, aucune donnée réelle publiée.
              dbt docs generate --static --no-use-colors
              cp "$DBT_TARGET_PATH/static_index.html" /opt/airflow/site/index.html
            '
          test -s site/index.html

      - name: Préparer la doc dbt pour GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  # Publie la doc dbt sur GitHub Pages, seulement après un push sur main dont tous les tests passent.
  docs:
    name: Publier la doc dbt
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [pytest, image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
