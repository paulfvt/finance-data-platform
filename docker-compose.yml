# Airflow en LocalExecutor avec une base Postgres : les tâches peuvent tourner en
# parallèle, contrairement à `airflow standalone` (SQLite, une tâche à la fois).
# `restart: unless-stopped` relance tout dès que Docker Desktop démarre.

x-airflow-common: &airflow-common
  build: .
  image: finance-data-platform-airflow:2.9.3
  restart: unless-stopped
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-change-me-local-only}
    PYTHONPATH: /opt/airflow
    DBT_PROFILES_DIR: /opt/airflow/dbt
    DBT_TARGET_PATH: /tmp/dbt_target
    DBT_LOG_PATH: /tmp/dbt_logs
    DATA_DIR: /opt/airflow/data
    DBT_SEND_ANONYMOUS_USAGE_STATS: "false"   # pas de télémétrie dbt
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./config:/opt/airflow/config
    - ./data:/opt/airflow/data
    - ./tests:/opt/airflow/tests
    - ./dbt:/opt/airflow/dbt
    - airflow_logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    container_name: finance_platform_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  # Tourne une fois au démarrage : met le schéma de la base à jour et crée le compte admin.
  airflow-init:
    <<: *airflow-common
    container_name: finance_platform_airflow_init
    restart: "no"
    command: >
      bash -c "airflow db migrate &&
      airflow users create --role Admin
      --username ${AIRFLOW_ADMIN_USER:-admin}
      --password ${AIRFLOW_ADMIN_PASSWORD:-admin}
      --firstname Admin --lastname Local --email admin@example.com || true"

  airflow-scheduler:
    <<: *airflow-common
    container_name: finance_platform_scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-webserver:
    <<: *airflow-common
    container_name: finance_platform_webserver
    command: webserver
    ports:
      - "127.0.0.1:8080:8080"   # accessible depuis ta machine seulement
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # --- Couche streaming (lot 2) ---------------------------------------------
  # Redpanda : broker compatible avec le protocole Kafka, en un seul binaire
  # (pas de ZooKeeper ni de JVM). Deux adresses d'écoute : redpanda:9092 pour
  # les conteneurs, 127.0.0.1:19092 pour les scripts lancés depuis Windows
  # (pas « localhost » : Windows le résout d'abord en IPv6 ::1, où rien n'écoute).
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.3.1
    container_name: finance_platform_redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --mode=dev-container        # réglages pour un poste de dev (pas de fsync strict, 1 nœud)
      - --smp=1
      - --memory=1G
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://127.0.0.1:19092
    ports:
      - "127.0.0.1:19092:19092"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 5s
      retries: 20

  # Tourne une fois au démarrage : crée le topic s'il n'existe pas (idempotent).
  # 2 partitions, avec le symbole comme clé : tous les trades BTC vont dans la
  # même partition, ce qui garantit leur ordre. Rétention de 7 jours.
  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:v26.3.1
    container_name: finance_platform_redpanda_init
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >
        rpk topic describe crypto.trades -X brokers=redpanda:9092 >/dev/null 2>&1
        || rpk topic create crypto.trades -X brokers=redpanda:9092
        --partitions 2 --replicas 1 --topic-config retention.ms=604800000
    depends_on:
      redpanda:
        condition: service_healthy

  # Producteur : websocket Coinbase -> topic crypto.trades.
  stream-producer:
    build:
      context: .
      dockerfile: Dockerfile.stream
    image: finance-data-platform-stream:latest
    container_name: finance_platform_stream_producer
    restart: unless-stopped
    command: ["python", "-m", "src.stream.producer"]
    environment:
      KAFKA_BOOTSTRAP: redpanda:9092
      KAFKA_TOPIC: crypto.trades
      PRODUCT_IDS: BTC-USD,ETH-USD
    volumes:
      - ./src:/app/src
    depends_on:
      redpanda-init:
        condition: service_completed_successfully

  # Consommateur : crypto.trades -> bougies 1 min -> data/live/bars (Parquet).
  stream-consumer:
    image: finance-data-platform-stream:latest
    container_name: finance_platform_stream_consumer
    restart: unless-stopped
    command: ["python", "-m", "src.stream.consumer"]
    environment:
      KAFKA_BOOTSTRAP: redpanda:9092
      KAFKA_TOPIC: crypto.trades
      KAFKA_GROUP_ID: bars-writer
      ALLOWED_LATENESS_S: "10"
    volumes:
      - ./src:/app/src
      - ./data:/app/data
    depends_on:
      stream-producer:
        condition: service_started

volumes:
  postgres_data:
  airflow_logs:
  redpanda_data:
