version: 2

# Tests unitaires dbt : des entrées simulées, un résultat attendu. Ils reprennent
# les tests de comportement de l'ancien code pandas, et `dbt build` les exécute
# avant de construire les modèles.

unit_tests:

  - name: staging_garde_la_version_du_run_le_plus_recent
    description: >
      Un même jour relu par deux runs Bronze : on garde le plus récent. Pour la crypto,
      le premier run a pu capturer une bougie encore incomplète.
    model: stg_bronze_prices
    given:
      # La source est un read_parquet, pas une table : dbt ne peut pas lire ses
      # types de colonnes, on fournit donc l'entrée en SQL typé.
      - input: source('bronze', 'prices')
        format: sql
        rows: |
          select '/data/bronze/2026-08-10/bitcoin.parquet' as filename, 'BTC-USD' as ticker, timestamp '2026-08-10' as date,
                 64000.0 as open, 65278.0 as high, 64489.0 as low, 64455.0 as close, 1.0 as volume
          union all
          select '/data/bronze/2026-08-11/bitcoin.parquet', 'BTC-USD', timestamp '2026-08-10', 64000.0, 65321.0, 63752.0, 63910.0, 2.0
          union all
          select '/data/bronze/2026-08-11/bitcoin.parquet', 'BTC-USD', timestamp '2026-08-11', 63910.0, 64500.0, 63500.0, 64100.0, 3.0
    expect:
      rows:
        - {ticker_name: bitcoin, price_date: "2026-08-10", close: 63910, run_date: "2026-08-11"}
        - {ticker_name: bitcoin, price_date: "2026-08-11", close: 64100, run_date: "2026-08-11"}

  - name: silver_ecarte_les_prix_invalides_et_calcule_les_rendements
    description: >
      Clôture nulle ou négative écartée ; pas de rendement pour la première séance ;
      rendement positif quand le prix monte ; moyenne mobile sur les séances disponibles
      en début d'historique ; volatilité à partir de 2 rendements seulement.
    model: silver_daily_prices
    given:
      - input: ref('stg_bronze_prices')
        rows:
          - {ticker_name: sp500, ticker: "^GSPC", price_date: "2026-11-02", open: 100, high: 101, low: 99, close: 100, volume: 0}
          - {ticker_name: sp500, ticker: "^GSPC", price_date: "2026-11-03", open: 100, high: 111, low: 99, close: 110, volume: 0}
          - {ticker_name: sp500, ticker: "^GSPC", price_date: "2026-11-04", open: 110, high: 111, low: 0, close: 0, volume: 0}
          - {ticker_name: sp500, ticker: "^GSPC", price_date: "2026-11-05", open: 110, high: 122, low: 109, close: 121, volume: 0}
    expect:
      rows:
        - {price_date: "2026-11-02", daily_return: null, ma_20: 100, volatility_20d: null}
        - {price_date: "2026-11-03", daily_return: 0.09531017980432493, ma_20: 105, volatility_20d: null}
        # 121/110 = 110/100 = 1,1 : deux rendements identiques, donc une volatilité nulle
        - {price_date: "2026-11-05", daily_return: 0.09531017980432493, ma_20: 110.33333333333333, volatility_20d: 0.0}

  - name: silver_pas_de_rendement_a_travers_un_trou_de_donnees
    description: >
      Un week-end (vendredi -> lundi, 3 jours) donne bien un rendement. Un trou de
      données (extraction arrêtée un mois) n'en donne pas : sinon un « rendement d'une
      séance » couvrirait un mois de mouvement et fausserait la volatilité.
    model: silver_daily_prices
    given:
      - input: ref('stg_bronze_prices')
        rows:
          - {ticker_name: sp500, ticker: "^GSPC", price_date: "2026-08-13", open: 100, high: 101, low: 99, close: 100, volume: 0}
          - {ticker_name: sp500, ticker: "^GSPC", price_date: "2026-08-14", open: 100, high: 101, low: 99, close: 100, volume: 0}
          - {ticker_name: sp500, ticker: "^GSPC", price_date: "2026-08-17", open: 100, high: 101, low: 99, close: 100, volume: 0}
          - {ticker_name: sp500, ticker: "^GSPC", price_date: "2026-09-15", open: 130, high: 131, low: 129, close: 130, volume: 0}
          - {ticker_name: sp500, ticker: "^GSPC", price_date: "2026-09-16", open: 130, high: 131, low: 129, close: 130, volume: 0}
    expect:
      rows:
        - {price_date: "2026-08-13", daily_return: null}
        - {price_date: "2026-08-14", daily_return: 0.0}
        - {price_date: "2026-08-17", daily_return: 0.0}
        - {price_date: "2026-09-15", daily_return: null}
        - {price_date: "2026-09-16", daily_return: 0.0}

  - name: gold_attend_une_fenetre_complete_et_comble_le_week_end
    description: >
      Fenêtre réduite à 3 jours pour le test. Les actions ne cotent pas le week-end
      du 7-8 : leur dernier PRIX est repris, ce qui donne des rendements nuls ces
      jours-là. La corrélation n'apparaît qu'avec 3 jours où les deux rendements sont
      connus. Paire orientée dans l'ordre du référentiel.
    model: gold_correlations_30d
    overrides:
      vars:
        correlation_window_days: 3
    given:
      - input: ref('tickers')
        rows:
          - {ticker_name: sp500, ticker: "^GSPC", asset_class: actions, display_order: 1}
          - {ticker_name: bitcoin, ticker: BTC-USD, asset_class: crypto, display_order: 6}
      - input: ref('silver_daily_prices')
        rows:
          - {ticker_name: sp500,   price_date: "2026-11-05", close: 100}
          - {ticker_name: sp500,   price_date: "2026-11-06", close: 101}
          - {ticker_name: sp500,   price_date: "2026-11-09", close: 104}
          - {ticker_name: bitcoin, price_date: "2026-11-05", close: 100}
          - {ticker_name: bitcoin, price_date: "2026-11-06", close: 102}
          - {ticker_name: bitcoin, price_date: "2026-11-07", close: 103}
          - {ticker_name: bitcoin, price_date: "2026-11-08", close: 106}
          - {ticker_name: bitcoin, price_date: "2026-11-09", close: 111}
    expect:
      # Le 07 : seulement 2 rendements connus dans la fenêtre (le 05 n'en a pas).
      # Le 08 : rendements action [ln 1,01 ; 0 ; 0], qui ne sont pas constants, donc la
      # corrélation existe. (Avec l'ancien ffill des rendements, l'action valait 0,01
      # trois fois de suite, la variance était nulle et cette ligne manquait.)
      rows:
        - {price_date: "2026-11-08", asset_1: sp500, asset_2: bitcoin}
        - {price_date: "2026-11-09", asset_1: sp500, asset_2: bitcoin}

  - name: gold_ne_comble_pas_un_trou_de_donnees
    description: >
      Fenêtre de 3 jours. Bitcoin n'a aucune donnée du 3 au 9 (extraction arrêtée, 6 jours
      sans cotation alors qu'il cote tous les jours) : au-delà de 4 jours, le prix n'est
      plus complété. Aucune corrélation ne doit s'appuyer sur un prix inventé : il faut
      attendre 3 rendements réels après le trou.
    model: gold_correlations_30d
    overrides:
      vars:
        correlation_window_days: 3
    given:
      - input: ref('tickers')
        rows:
          - {ticker_name: bitcoin, ticker: BTC-USD, asset_class: crypto, display_order: 6}
          - {ticker_name: ethereum, ticker: ETH-USD, asset_class: crypto, display_order: 7}
      - input: ref('silver_daily_prices')
        rows:
          - {ticker_name: bitcoin,  price_date: "2026-11-01", close: 100}
          - {ticker_name: bitcoin,  price_date: "2026-11-02", close: 101}
          - {ticker_name: bitcoin,  price_date: "2026-11-10", close: 120}
          - {ticker_name: bitcoin,  price_date: "2026-11-11", close: 118}
          - {ticker_name: bitcoin,  price_date: "2026-11-12", close: 121}
          - {ticker_name: bitcoin,  price_date: "2026-11-13", close: 125}
          - {ticker_name: ethereum, price_date: "2026-11-01", close: 10}
          - {ticker_name: ethereum, price_date: "2026-11-02", close: 10.2}
          - {ticker_name: ethereum, price_date: "2026-11-03", close: 10.1}
          - {ticker_name: ethereum, price_date: "2026-11-04", close: 10.4}
          - {ticker_name: ethereum, price_date: "2026-11-05", close: 10.3}
          - {ticker_name: ethereum, price_date: "2026-11-06", close: 10.5}
          - {ticker_name: ethereum, price_date: "2026-11-07", close: 10.6}
          - {ticker_name: ethereum, price_date: "2026-11-08", close: 10.4}
          - {ticker_name: ethereum, price_date: "2026-11-09", close: 10.8}
          - {ticker_name: ethereum, price_date: "2026-11-10", close: 11.0}
          - {ticker_name: ethereum, price_date: "2026-11-11", close: 10.9}
          - {ticker_name: ethereum, price_date: "2026-11-12", close: 11.2}
          - {ticker_name: ethereum, price_date: "2026-11-13", close: 11.5}
    expect:
      # Bitcoin : prix complété du 3 au 6 (4 jours), inconnu du 7 au 9, rendements réels
      # à nouveau à partir du 11 (le 10 n'a pas de veille connue).
      # - le 04 : rendements bitcoin [ln 1,01 ; 0 ; 0], corrélation définie ;
      # - les 05 et 06 : rendements bitcoin [0 ; 0 ; 0], série constante, pas de corrélation ;
      # - du 07 au 12 : la fenêtre touche le trou, pas de corrélation ;
      # - le 13 : trois rendements réels après le trou.
      rows:
        - {price_date: "2026-11-04", asset_1: bitcoin, asset_2: ethereum}
        - {price_date: "2026-11-13", asset_1: bitcoin, asset_2: ethereum}
