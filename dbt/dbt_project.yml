name: finance_platform
version: "2.0.0"
config-version: 2
profile: finance_platform

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

# Variables d'environnement lues par dbt (définies dans docker-compose.yml et la CI) :
# - DATA_DIR : racine des données (/opt/airflow/data dans le conteneur, des fixtures en CI)
# - DBT_TARGET_PATH, DBT_LOG_PATH : hors du volume monté depuis Windows (écritures nombreuses et lentes)
clean-targets: ["target", "logs"]

models:
  finance_platform:
    staging:
      # Vue en mémoire : les contrôles d'entrée s'y appliquent AVANT l'écriture
      # de Silver et Gold. DuckDB tournant en mémoire, chaque commande dbt repart
      # d'une base vide : toujours passer par `dbt build` (seeds, modèles et
      # tests dans la même commande), jamais par un `dbt run -s` isolé.
      +materialized: view
